<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse of Gods Menu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            font-family: Open Sans;
            color: #eeeeee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .screen { display: none; width: 100%; max-width: 900px; }
        .screen.active { display: block; }

        .menu-container {
            width: 100%;
            text-align: center;
            padding: 40px 20px;
            border-radius: 20px;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px currentColor;
        }

        .button-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-btn {
            background: #0f3460;
            border: 1px solid rgba(255,255,255,0.1);
            color: #eeeeee;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            box-shadow: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 180px;
            letter-spacing: 1px;
        }

        .menu-btn:hover { background: #e94560; transform: scale(1.05); }
        .menu-btn.back-btn { background: #555; border-color: #777; }
        .menu-btn.back-btn:hover { background: #777; }

        /* Компоненты */
        .components-wrapper {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto 30px;
        }

        .component-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .component-label {
            font-size: 1.05rem;
            min-width: 140px;
            text-align: left;
            opacity: 0.9;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 190px;
            height: 6px;
            background: #0f3460;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s;
        }

        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .slider-value {
            min-width: 35px;
            text-align: right;
            font-size: 0.95rem;
            opacity: 0.7;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: #e94560;
            cursor: pointer;
        }

        select {
            background: #0f3460;
            color: #eeeeee;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        input[type="text"] {
            background: #0f3460;
            color: #eeeeee;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            width: 200px;
            outline: none;
        }

        input[type="text"]::placeholder { opacity: 0.45; }

        .static-text {
            opacity: 0.55;
            font-size: 0.9rem;
            text-align: center;
            padding: 4px 0;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .menu-btn { padding: 12px 25px; font-size: 1.1rem; min-width: 140px; }
            input[type="range"] { width: 130px; }
        }
        </style>
</head>
<body>
<div id="screen-main" class="screen active">
    <div class="menu-container">
        <h1>Eclipse of Gods Menu</h1>
        <div class="button-wrapper">
            <button class="menu-btn">Пункт 1</button>
            <button class="menu-btn">Пункт 2</button>
            <button class="menu-btn">Пункт 3</button>
        </div>
    </div>
</div>
<div id="screen-screen" class="screen">
    <div class="menu-container">
        <h1>Персонажи</h1>
        <div class="components-wrapper">
            <p class="static-text">Character switcher</p>
        </div>
        <div class="button-wrapper">
            <button class="menu-btn">Воин</button>
            <button class="menu-btn">Маг</button>
            <button class="menu-btn">Лучник</button>
            <button class="menu-btn back-btn" onclick="showScreen('main')">Назад</button>
        </div>
    </div>
</div>

<script>
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById('screen-' + screenId);
            if (target) target.classList.add('active');
            else console.warn('Screen not found: screen-' + screenId);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const active = document.querySelector('.screen.active');
                if (active && active.id !== 'screen-main') showScreen('main');
            }
        });
        </script>
</body>
</html>
