<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Файловый менеджер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #ffffff;
            font-family: "Arial";
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .screen { display: none; width: 100%; max-width: 900px; }
        .screen.active { display: block; }

        .menu-container {
            width: 100%;
            text-align: center;
            padding: 40px 20px;
            border-radius: 20px;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px currentColor;
        }

        .button-wrapper {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-btn {
            background: #0055ff;
            border: 1px solid rgba(255,255,255,0.1);
            color: #000000;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 180px;
            letter-spacing: 1px;
        }

        .menu-btn:hover { background: #0055ff; transform: scale(1.05); }
        .menu-btn.back-btn { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
        .menu-btn.back-btn:hover { background: rgba(255,255,255,0.15); }

        
        .components-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 560px;
            margin-top: 8px;
        }

        .component-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .component-label {
            font-size: 0.97rem;
            min-width: 130px;
            opacity: 0.9;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 180px;
            height: 5px;
            background: #0055ff;
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 17px; height: 17px;
            background: #0055ff;
            border-radius: 50%;
            cursor: pointer;
        }

        .slider-value {
            min-width: 32px;
            text-align: right;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        input[type="checkbox"] {
            width: 20px; height: 20px;
            accent-color: #0055ff;
            cursor: pointer;
        }

        select {
            background: #0055ff;
            color: #000000;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        input[type="text"] {
            background: #0055ff;
            color: #000000;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            width: 195px;
            outline: none;
        }
        input[type="text"]::placeholder { opacity: 0.4; }

        .static-text {
            opacity: 0.5;
            font-size: 0.9rem;
            padding: 6px 0;
        }
        

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .menu-btn { padding: 12px 25px; font-size: 1.1rem; min-width: 140px; }
            input[type="range"] { width: 130px; }
        }
        </style>
</head>
<body>
<div id="screen-main" class="screen active">
    <div class="menu-container">
        <h1>Файловый менеджер</h1>
        <div class="button-wrapper">
            <button class="menu-btn" onclick="showScreen('dashboard')">Дашборд</button>
            <button class="menu-btn">Общие</button>
            <button class="menu-btn">Избранное</button>
            <button class="menu-btn">Корзина</button>
            <button class="menu-btn">Помощь</button>
            <button class="menu-btn" onclick="showScreen('settings')">Настройки</button>
        </div>
    </div>
</div>
<div id="screen-dashboard" class="screen">
    <div class="menu-container">
        <h1>Дашборд</h1>
        <div class="components-wrapper">
            <div class="component-row">
                <span class="component-label">Папки с размером и количеством файлов</span>
                <input type="range" id="c_папки_с_размером_и_количеством" min="0" max="100" value="50" oninput="document.getElementById('c_папки_с_размером_и_количеством_val').textContent=this.value">
                <span class="slider-value" id="c_папки_с_размером_и_количеством_val">50</span>
            </div>
        </div>
        <div class="button-wrapper">
            <button class="menu-btn">Счётчики файлов по типам</button>
            <button class="menu-btn">Таблица последних файлов</button>
            <button class="menu-btn back-btn" onclick="goBack()">Назад</button>
        </div>
    </div>
</div>
<div id="screen-settings" class="screen">
    <div class="menu-container">
        <h1>Настройки</h1>
        <div class="components-wrapper">
            <div class="component-row">
                <span class="component-label">Квота</span>
                <input type="range" id="c_квота" min="0" max="100" value="50" oninput="document.getElementById('c_квота_val').textContent=this.value">
                <span class="slider-value" id="c_квота_val">50</span>
            </div>
            <div class="component-row">
                <span class="component-label">Авtosинхронизация</span>
                <input type="checkbox" id="c_авtosинхронизация" checked>
            </div>
        </div>
        <div class="button-wrapper">
            <button class="menu-btn back-btn" onclick="goBack()">Назад</button>
        </div>
    </div>
</div>

<script>
        const _history = ['main'];

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById('screen-' + screenId);
            if (target) {
                target.classList.add('active');
                if (_history[_history.length - 1] !== screenId) _history.push(screenId);
            } else {
                console.warn('Screen not found: screen-' + screenId);
            }
        }

        function goBack() {
            if (_history.length > 1) _history.pop();
            showScreen(_history[_history.length - 1]);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') goBack();
        });
        </script>
</body>
</html>
